name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            g++ \
            python3 \
            python3-pip \
            python3-numpy \
            libpthread-stubs0-dev \
            libx11-dev \
            unzip

      # validate_export.py needs numpy only. torch is NOT required by the build
      # job — the Python↔C++ reference fixtures are committed (see models/), so
      # the fixture generator (which does need torch) is not run here.

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Verify symbols
        run: |
          echo "=== CLAP entry ==="
          readelf --dyn-syms build/plugins/MambaSuite.clap | grep clap_entry
          echo "=== ARA factory ==="
          readelf --dyn-syms build/plugins/MambaSuiteARA.so | grep ARAGetFactory
          echo "=== RPATH ==="
          readelf -d build/plugins/MambaSuite.clap | grep RUNPATH
          readelf -d build/plugins/MambaSuiteARA.so | grep RUNPATH

      # A 132-byte file here means an unresolved Git LFS pointer, not a model:
      # that silently broke every clone until 2026-10-04 (see .gitattributes).
      - name: Verify model files (Mamba-3 flat binary)
        run: |
          M=build/plugins/models/model.bin
          test -f "$M"
          SIZE=$(stat -c %s "$M")
          if [ "$SIZE" -ne 6649600 ]; then
            echo "FAIL: $M is $SIZE bytes, expected 6,649,600"
            head -c 60 "$M" || true
            exit 1
          fi
          if head -c 8 "$M" | grep -q '^version '; then
            echo "FAIL: $M is an unresolved Git LFS pointer"
            exit 1
          fi
          echo "OK: model.bin deployed ($SIZE bytes)"

      - name: Verify engine source files
        run: |
          test -f src/core/SsmInferenceCore.cpp
          test -f src/core/SsmBlock.cpp
          test -f src/core/WeightLoader.cpp
          test -f src/core/SPSCQueue.hpp

      # Asset names are version- and runner-specific. The previous URL
      # (clap-validator-linux-x86_64.tar.gz) has never existed in any release,
      # which is what turned this job red on main. Pinned to the 0.4.1 build
      # published for ubuntu-22.04.
      - name: Download clap-validator
        run: |
          set -euo pipefail
          URL="https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip"
          wget -q -O clap-validator.zip "$URL"
          unzip -o -q clap-validator.zip
          V=$(find . -maxdepth 3 -type f -name 'clap-validator' | head -1)
          test -n "$V"
          chmod +x "$V"
          echo "CLAP_VALIDATOR=$V" >> "$GITHUB_ENV"
          "$V" --version || true

      # Advisory. A full local run on 2026-10-31 had 5 known failures
      # (state-reproducibility x3, param-fuzz-basic/bounds timing out because
      # the engine is slower than real time). The required subset runs in
      # ctest (tests/clap_validator.cmake) and must pass.
      - name: Validate CLAP plugin (full, advisory)
        run: |
          "$CLAP_VALIDATOR" validate build/plugins/MambaSuite.clap
        continue-on-error: true

      - name: Verify ARA library
        run: |
          echo "=== ARA Library Info ==="
          file build/plugins/MambaSuiteARA.so
          readelf --dyn-syms build/plugins/MambaSuiteARA.so | grep ARAGetFactory
          readelf -d build/plugins/MambaSuiteARA.so | grep RUNPATH

      - name: Verify stripped (release build)
        run: |
          if readelf -S build/plugins/MambaSuite.clap 2>/dev/null | grep -q .symtab; then
            echo "WARNING: Binary not stripped (expected in Debug, optional in Release)"
          else
            echo "OK: Binary is stripped"
          fi

      - name: Validate model export (Python round-trip)
        run: |
          python3 python/tools/validate_export.py

      - name: Build VST3 wrapper
        run: cmake --build build --target MambaSuite_as_vst3 --parallel $(nproc)

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba-plugins-${{ github.sha }}
          path: |
            build/plugins/MambaSuite.clap
            build/Release/MambaSuite.vst3
            build/plugins/MambaSuiteARA.so
            build/plugins/models/
          if-no-files-found: error

  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ python3 python3-numpy

      # models/model.bin is generated at configure time (numpy only).
      # The reference fixtures (models/input_ref.bin, output_ref.bin) are
      # committed, so the torch-based generator is not invoked here. See
      # python/tools/dump_engine_reference.py if it ever needs regenerating.
      - name: Configure CMake with tests
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build tests
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        shell: pwsh
        run: |
          pip install numpy --quiet

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Verify CLAP plugin
        shell: pwsh
        run: Test-Path build/plugins/Release/MambaSuite.clap

      - name: Verify ARA library
        shell: pwsh
        run: Test-Path build/plugins/Release/MambaSuiteARA.dll

      - name: Verify model files
        shell: pwsh
        run: |
          $m = "build/plugins/models/model.bin"
          if (-not (Test-Path $m)) { throw "missing $m" }
          $size = (Get-Item $m).Length
          if ($size -ne 6649600) { throw "$m is $size bytes, expected 6,649,600 (LFS pointer?)" }
          Write-Host "OK: model.bin deployed ($size bytes)"

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamba-plugins-windows-${{ github.sha }}
          path: |
            build/plugins/Release/MambaSuite.clap
            build/plugins/Release/MambaSuiteARA.dll
            build/plugins/models/
          if-no-files-found: error

  test-windows:
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install numpy --quiet

      - name: Configure CMake with tests
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build tests
        run: cmake --build build --config Debug --parallel $env:NUMBER_OF_PROCESSORS

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build --build-config Debug --output-on-failure
