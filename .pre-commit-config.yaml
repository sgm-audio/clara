# pre-commit configuration for CLARA — Mamba Audio Suite
# Install: pre-commit install
# Run all: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      # The weights are 6.6 MB and are committed directly (see models/README.md).
      # The old 500 KB limit is what pushed them into Git LFS, whose budget was
      # then exceeded — breaking every clone. Keep the guard for everything else.
      - id: check-added-large-files
        args: ["--maxkb=8000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-symlinks
      - id: destroyed-symlinks

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: [--style=file]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --line-length=100]
        types: [python]
